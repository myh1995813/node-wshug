<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>独一无二的数字艺术空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 动态背景粒子效果 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 1s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            font-weight: 300;
        }

        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: block;
        }

        .card-title {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .card-description {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        /* 交互式按钮 */
        .interactive-section {
            text-align: center;
            margin: 50px 0;
        }

        .magic-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .magic-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .magic-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .magic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* 颜色变化区域 */
        .color-showcase {
            margin: 50px 0;
            text-align: center;
        }

        .color-box {
            display: inline-block;
            width: 100px;
            height: 100px;
            margin: 10px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .color-box:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .color-box::after {
            content: attr(data-color);
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .color-box:hover::after {
            opacity: 1;
        }

        /* 动画展示区 */
        .animation-showcase {
            margin: 50px 0;
            text-align: center;
        }

        .animated-element {
            display: inline-block;
            width: 150px;
            height: 150px;
            margin: 20px;
            position: relative;
        }

        .rotating-square {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .pulsing-circle {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 30px;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 50px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .card-grid {
                grid-template-columns: 1fr;
            }
            
            .color-box {
                width: 70px;
                height: 70px;
            }
        }

        /* 特殊效果 */
        .glow {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #e60073; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- 动态粒子背景 -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <!-- 标题区域 -->
        <header class="header">
            <h1 class="glow">独一无二的数字艺术空间</h1>
            <p class="subtitle">探索创意与技术的完美融合</p>
        </header>

        <!-- 卡片网格 -->
        <div class="card-grid">
            <div class="card" onclick="showMessage('创意设计')">
                <span class="card-icon">🎨</span>
                <h3 class="card-title">创意设计</h3>
                <p class="card-description">将艺术灵感转化为视觉盛宴，每一个像素都承载着创意的火花。</p>
            </div>
            
            <div class="card" onclick="showMessage('交互体验')">
                <span class="card-icon">✨</span>
                <h3 class="card-title">交互体验</h3>
                <p class="card-description">流畅的动画效果与直观的用户界面，带来前所未有的互动体验。</p>
            </div>
            
            <div class="card" onclick="showMessage('技术创新')">
                <span class="card-icon">🚀</span>
                <h3 class="card-title">技术创新</h3>
                <p class="card-description">运用最新的前端技术，打造性能卓越的网络应用。</p>
            </div>
        </div>

        <!-- 交互式按钮 -->
        <div class="interactive-section">
            <button class="magic-button" onclick="performMagic()">
                ✨ 点击施展魔法
            </button>
        </div>

        <!-- 颜色变化区域 -->
        <div class="color-showcase">
            <h3 style="color: white; margin-bottom: 20px;">🌈 色彩魔法</h3>
            <div class="color-box" style="background: linear-gradient(45deg, #ff9a9e, #fecfef);" data-color="樱花粉" onclick="changeTheme('#ff9a9e')"></div>
            <div class="color-box" style="background: linear-gradient(45deg, #a8edea, #fed6e3);" data-color="薄荷绿" onclick="changeTheme('#a8edea')"></div>
            <div class="color-box" style="background: linear-gradient(45deg, #ffecd2, #fcb69f);" data-color="落日橙" onclick="changeTheme('#ffecd2')"></div>
            <div class="color-box" style="background: linear-gradient(45deg, #667eea, #764ba2);" data-color="梦幻紫" onclick="changeTheme('#667eea')"></div>
        </div>

        <!-- 动画展示区 -->
        <div class="animation-showcase">
            <h3 style="color: white; margin-bottom: 20px;">🎭 动画展示</h3>
            <div class="animated-element">
                <div class="rotating-square"></div>
            </div>
            <div class="animated-element">
                <div class="pulsing-circle"></div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            <p>&copy; 2024 独一无二的数字艺术空间 | 用心创造，用爱分享</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">🌟 每一个互动都是独特的体验 🌟</p>
        </footer>
    </div>

    <script>
        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // 显示消息
        function showMessage(type) {
            const messages = {
                '创意设计': '创意是设计的灵魂，让每个作品都充满生命力！',
                '交互体验': '用户体验是产品的核心，我们追求极致的交互流畅度！',
                '技术创新': '技术驱动创新，让不可能变为可能！'
            };
            
            alert(messages[type] || '感谢你的关注！');
        }

        // 施展魔法效果
        function performMagic() {
            const button = event.target;
            button.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                
                // 创建魔法粒子效果
                for (let i = 0; i < 20; i++) {
                    createMagicParticle(button);
                }
                
                // 显示魔法消息
                const messages = [
                    '✨ 魔法施展成功！页面变得更加美丽了！',
                    '🌟 创意之光点亮了整个空间！',
                    '🎨 艺术的魔力在空气中流动！',
                    '💫 想象力转化为现实的奇迹！'
                ];
                
                alert(messages[Math.floor(Math.random() * messages.length)]);
            }, 150);
        }

        // 创建魔法粒子
        function createMagicParticle(element) {
            const particle = document.createElement('div');
            particle.style.position = 'absolute';
            particle.style.width = '6px';
            particle.style.height = '6px';
            particle.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            particle.style.borderRadius = '50%';
            particle.style.pointerEvents = 'none';
            particle.style.zIndex = '9999';
            
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            document.body.appendChild(particle);
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 100 + 50;
            const lifetime = Math.random() * 1000 + 500;
            
            let startTime = Date.now();
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / lifetime;
                
                if (progress >= 1) {
                    particle.remove();
                    return;
                }
                
                const dx = Math.cos(angle) * velocity * progress;
                const dy = Math.sin(angle) * velocity * progress + 50 * progress * progress;
                
                particle.style.transform = `translate(${dx}px, ${dy}px)`;
                particle.style.opacity = 1 - progress;
                
                requestAnimationFrame(animate);
            }
            
            animate();
        }

        // 改变主题颜色
        function changeTheme(color) {
            document.body.style.background = `linear-gradient(135deg, ${color} 0%, ${adjustColor(color, -20)} 100%)`;
            
            // 添加颜色变化动画
            document.body.style.transition = 'background 0.5s ease';
            
            setTimeout(() => {
                document.body.style.transition = '';
            }, 500);
        }

        // 调整颜色亮度
        function adjustColor(color, amount) {
            const usePound = color[0] === '#';
            const col = usePound ? color.slice(1) : color;
            const num = parseInt(col, 16);
            let r = (num >> 16) + amount;
            let g = (num >> 8 & 0x00FF) + amount;
            let b = (num & 0x0000FF) + amount;
            r = r > 255 ? 255 : r < 0 ? 0 : r;
            g = g > 255 ? 255 : g < 0 ? 0 : g;
            b = b > 255 ? 255 : b < 0 ? 0 : b;
            return (usePound ? '#' : '') + (r << 16 | g << 8 | b).toString(16).padStart(6, '0');
        }

        // 页面加载完成后初始化
        window.addEventListener('load', () => {
            createParticles();
            
            // 添加滚动效果
            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                const parallax = document.querySelector('.header');
                const speed = scrolled * 0.5;
                parallax.style.transform = `translateY(${speed}px)`;
            });
            
            // 添加鼠标跟随效果
            document.addEventListener('mousemove', (e) => {
                const cursor = document.createElement('div');
                cursor.style.position = 'fixed';
                cursor.style.width = '20px';
                cursor.style.height = '20px';
                cursor.style.background = `radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent)`;
                cursor.style.borderRadius = '50%';
                cursor.style.pointerEvents = 'none';
                cursor.style.zIndex = '9998';
                cursor.style.left = e.clientX - 10 + 'px';
                cursor.style.top = e.clientY - 10 + 'px';
                cursor.style.transition = 'all 0.1s ease';
                
                document.body.appendChild(cursor);
                
                setTimeout(() => {
                    cursor.remove();
                }, 100);
            });
        });

        // 添加键盘交互
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                performMagic();
            }
        });
    </script>
</body>
</html>
